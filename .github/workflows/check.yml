name: check

# The kit's own gate. Close to what `kit init --stack go` generates, with one
# deliberate difference: this repo runs `kit audit --strict` and a scaffolded
# project does not.
#
# The difference is not a double standard, it is that the constraint does not
# apply here. Auditing elsewhere means *installing* the kit, and the kit is a
# private module, so every scaffolded project would need a credential. This repo
# already has the source, so `go run ./cmd/kit` audits it with nothing to
# authenticate. The kit should hold itself to the check it cannot cheaply hand
# out.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - run: make check

      # No install step: `go run` builds from the checkout, so this works on a
      # private repo with no token.
      - run: go run ./cmd/kit audit . --strict
