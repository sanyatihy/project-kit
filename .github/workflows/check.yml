name: check

# The kit's own gate. Close to what `kit init --stack go` generates, with one
# deliberate difference: this repo runs `kit audit --strict` and a scaffolded
# project does not.
#
# The difference is not a double standard, it is that the constraint does not
# apply here. Auditing elsewhere means *installing* the kit, and the kit is a
# private module, so every scaffolded project would need a credential. This repo
# already has the source, so `go run ./cmd/kit` audits it with nothing to
# authenticate. The kit should hold itself to the check it cannot cheaply hand
# out.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The default is six hours, which is what a hung step costs when nothing caps it.
    # The job is minutes: the gate is a 10s test run locally, and the two network
    # steps download. 15 is room for a cold module cache, not for a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Install only: `make check` runs the lint, so this job runs the Makefile's
      # list and nothing beside it. Pinned because `latest` turns the trunk red on
      # a linter release with no commit behind it; the enabled set is pinned too,
      # in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      # Makefile CI_STEPS, in order. cmd/kit/ci_test.go fails when these drift
      # apart, so a green `make check` is a green job here.
      - run: make check

      # A gate, not a build step: it fails the commit rather than the release.
      - run: make vuln

      # No install step: `go run` builds from the checkout, so this works on a
      # private repo with no token.
      - run: make audit
