name: check

# One gate: the same `make check` you run locally, plus the docs audit.
# Deployment lives in its own workflow, added when the project has something
# to deploy.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - run: make check

      # Fails the build when a doc claims something the repo contradicts.
      - run: go install github.com/sanyatihy/project-kit/cmd/kit@latest
      - run: kit audit . --strict
