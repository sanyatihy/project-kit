name: check

# One gate: the same `make check` you run locally. Deployment lives in its own
# workflow, added when the project has something to deploy.
#
# `kit audit --strict` deliberately does not run here. It would mean installing
# the kit, which is a private module, which means a credential in every project
# scaffolded from this template — one more secret to store and rotate in each
# repo, and a first push that fails until someone sets it. Drift is cheap to
# catch locally, where `kit next` is already being run; it is not worth that.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A job with no limit inherits a six-hour default, which is what a hung run costs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true

      # The interpreter .python-version selects, not whichever one the runner ships.
      - run: uv python install

      # --locked fails rather than resolving: a lockfile that does not match
      # pyproject.toml is a difference between this run and the last one.
      - run: uv sync --locked

      - run: make check
