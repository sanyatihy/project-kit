[project]
name = "{{name}}"
version = "0.1.0"
description = ""
requires-python = ">=3.12.9"
dependencies = []

[project.scripts]
{{name}} = "{{pkg}}.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{pkg}}"]

# Dev tools are declared here rather than in dependencies, because none of them ship.
[dependency-groups]
dev = ["pytest", "mypy", "ruff", "pip-audit"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Strict is decided once, at the top, rather than per module: static types are optional in
# Python, so a per-module choice is one nobody ever makes.
[tool.mypy]
strict = true
files = ["src", "tests"]

# -W error is what turns a deprecation into a failure one release before it becomes a
# breakage. --strict-markers stops a typo in a marker silently selecting nothing.
[tool.pytest.ini_options]
addopts = "-W error --strict-markers"
testpaths = ["tests"]
